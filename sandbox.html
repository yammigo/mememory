<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    font-size: 13px;
    background: #1a1a2e;
    color: #e0e0e0;
    padding: 12px;
    overflow: auto;
  }
  #output {
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
  }
  .log-line { color: #a0d0a0; }
  .error-line { color: #ff6b6b; }
  .return-line { color: #74b9ff; }
  .info-line { color: #888; }
</style>
</head>
<body>
<div id="output"></div>
<script>
(function() {
  const output = document.getElementById('output');

  function appendLine(text, cls) {
    const div = document.createElement('div');
    div.className = cls || '';
    div.textContent = text;
    output.appendChild(div);
  }

  function formatValue(v) {
    if (v === undefined) return 'undefined';
    if (v === null) return 'null';
    if (typeof v === 'object') {
      try { return JSON.stringify(v, null, 2); } catch { return String(v); }
    }
    return String(v);
  }

  // 安全的 console 代理
  const safeConsole = {
    log: function() { appendLine(Array.from(arguments).map(formatValue).join(' '), 'log-line'); },
    info: function() { appendLine(Array.from(arguments).map(formatValue).join(' '), 'log-line'); },
    warn: function() { appendLine('[WARN] ' + Array.from(arguments).map(formatValue).join(' '), 'error-line'); },
    error: function() { appendLine('[ERROR] ' + Array.from(arguments).map(formatValue).join(' '), 'error-line'); },
    table: function(data) { appendLine(formatValue(data), 'log-line'); },
    clear: function() { output.innerHTML = ''; },
  };

  window.addEventListener('message', function(e) {
    const data = e.data;
    if (!data || data.type !== 'sandbox_exec') return;

    const code = data.code;
    const id = data.id;
    output.innerHTML = '';

    try {
      // 创建执行环境，仅替换 console 用于捕获输出
      const fn = new Function('console',
        '"use strict";\n' + code
      );

      const result = fn(safeConsole);

      if (result !== undefined) {
        appendLine('← ' + formatValue(result), 'return-line');
      }

      // 收集输出
      const logs = output.innerText;

      window.parent.postMessage({
        type: 'sandbox_result',
        id: id,
        success: true,
        output: logs,
        result: result !== undefined ? formatValue(result) : null,
      }, '*');

    } catch (err) {
      appendLine('Error: ' + err.message, 'error-line');
      appendLine(err.stack || '', 'error-line');

      window.parent.postMessage({
        type: 'sandbox_result',
        id: id,
        success: false,
        error: err.message,
        stack: err.stack || '',
        output: output.innerText,
      }, '*');
    }
  });

  // 通知主页面沙箱已就绪
  window.parent.postMessage({ type: 'sandbox_ready' }, '*');
})();
</script>
</body>
</html>
